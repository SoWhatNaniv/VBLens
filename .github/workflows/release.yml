name: Release

# Builds the Windows app and publishes it as a GitHub release.
# Trigger: push a tag such as v1.0.1, or push to the `release` branch
# (the release is then tagged v<version from package.json>).
on:
  push:
    tags: ['v*']
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build VBLens for Windows
        run: npm run dist:win
      - name: Release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: VBLens-Windows-x64
          path: release/*.zip
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: VBLens ${{ steps.tag.outputs.name }}
          files: release/*.zip
          generate_release_notes: true
          body: |
            **Download `VBLens-Windows-x64-*.zip` below**, unzip it and run `VBLens\VBLens.exe`. No installation needed.

            Everything is free and open source (MIT): decompiled VB source for native code and P-Code, form designer, graph, cross references, project export and AI agent access over MCP.

            The build is not code-signed yet, so Windows SmartScreen may warn the first time. Click *More info → Run anyway*.
