name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build the app page
        run: npm run build
      - name: Build the engine / MCP server
        run: npm run build:mcp
      - name: MCP server starts
        run: |
          node dist-mcp/vblens-mcp.mjs --help
